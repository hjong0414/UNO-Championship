<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171713">
  <title>UNO Championship</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="masthead"><a class="brand" href="/">UNO<span> / </span>CHAMPIONSHIP</a><span class="connection" id="connection">2–8인 멀티플레이</span></header>
  <main>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="entry" class="entry">
      <div class="hero">
        <div class="fan" aria-hidden="true"><span>7</span><span>↻</span><span>+2</span></div>
        <h1>UNO<br>Championship</h1>
        <p>매 라운드 바뀌는 두 가지 규칙. 먼저 3승을 거두면 우승.</p>
      </div>
      <form id="entry-form" class="panel join">
        <h2>플레이하기</h2>
        <label for="name">닉네임</label>
        <input id="name" maxlength="16" placeholder="닉네임을 입력하세요" required>
        <button class="primary" type="submit" value="create">새 방 만들기</button>
        <hr>
        <label for="code">친구의 방 코드</label>
        <input id="code" maxlength="6" placeholder="6자리 코드" autocomplete="off" spellcheck="false">
        <button type="submit" value="join">방 참가하기</button>
      </form>
    </section>
    <section id="arena" hidden>
      <div class="room-header">
        <div><p class="eyebrow" id="round-label"></p><h1 id="headline"></h1></div>
        <div class="controls"><button id="copy" type="button"></button><button class="plain" id="leave" type="button">방 나가기</button></div>
      </div>
      <div class="layout">
        <div class="table-column">
          <section class="panel tabletop" aria-label="게임 테이블">
            <div id="lobby">
              <h2 id="lobby-title"></h2><p id="lobby-text"></p><button id="start" type="button" class="primary">라운드 시작</button>
            </div>
            <div id="table-play" hidden>
              <div class="piles"><div><div class="card back" aria-hidden="true">UNO</div><p id="deck"></p></div><div><div id="top-card"></div><p id="active-color"></p></div></div>
              <p id="turn-detail"></p>
              <div class="controls table-controls">
                <button id="draw" class="primary" type="button">카드 뽑기</button>
                <button id="pass" type="button" hidden>턴 넘기기</button>
                <button id="catch" type="button" hidden>UNO 지적</button>
              </div>
            </div>
          </section>
          <section id="hand-area" class="panel hand-area" hidden>
            <div class="hand-heading"><h2 id="hand-title">내 손패</h2><label class="uno-check"><input type="checkbox" id="uno"> 이 카드와 함께 UNO 외치기</label></div>
            <p id="hand-hint"></p><div id="hand" class="hand"></div>
          </section>
        </div>
        <aside>
          <section class="panel side"><h2>플레이어</h2><ul id="players"></ul></section>
          <section class="panel side"><h2>추가 규칙</h2><div id="rules"></div></section>
          <section class="panel side"><h2>게임 기록</h2><ul id="events" class="events"></ul></section>
        </aside>
      </div>
    </section>
  </main>
  <dialog id="choice"><form method="dialog"><h2 id="choice-title"></h2><div id="options" class="options"></div><button value="cancel">취소</button></form></dialog>
</body>
</html>
